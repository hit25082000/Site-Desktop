<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Retrato — Retratos Executivos & Posicionamento de Imagem</title>
    
    <!-- Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              serif: ['"Instrument Serif"', 'serif'],
              body: ['"Outfit"', 'sans-serif'],
              geist: ['"Outfit"', 'sans-serif'],
              aeonika: ['"Plus Jakarta Sans"', 'sans-serif'],
              ffpqr: ['"Plus Jakarta Sans"', 'sans-serif'],
              bytalion: ['"Plus Jakarta Sans"', 'sans-serif'],
              italiana: ['"Instrument Serif"', 'serif'],
            }
          }
        }
      }
    </script>
    
    <!-- Custom styling to ensure scrollbar and custom font behavior -->
    <style>
      .font-geist { font-family: 'Outfit', sans-serif !important; }
      .font-sans { font-family: 'Plus Jakarta Sans', sans-serif !important; }
      .font-serif { font-family: 'Instrument Serif', serif !important; }
      .font-italiana { font-family: 'Instrument Serif', serif !important; }
      svg {
        stroke-width: 1.25px !important;
      }
      body {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        min-height: 100vh !important;
      }
    </style>
  </head>
  <body class="antialiased bg-neutral-50 text-neutral-900" style="font-family: 'Outfit', ui-sans-serif, system-ui">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
